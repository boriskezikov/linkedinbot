spring:
  application:
    name: linkedin-bot
  liquibase:
    change-log: 'classpath:db-migrations/changelog.xml'
    user: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  datasource:
    url: "jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?currentSchema=${DATABASE_SCHEMA}"
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    properties: {"hibernate.temp.use_jdbc_metadata_defaults": "false"}
    hibernate.ddl-auto: none
    open-in-view: false

bot:
  name: ${BOT_NAME}
  token: ${BOT_TOKEN}
  admin:
    name: ${ADMIN_NICKNAME}
    chatId: ${ADMIN_CHATID}
  random:
    limit: ${BOT_RANDOM_LIMIT}

server:
  port: ${PORT:5000}


allpay:
  api-login: ${AP_CLIENT_ID:pp1009265}
  api-key: ${AP_CLIENT_SECRET:DD4318BB9BF105E6F4616E0A83D82174}
  api-pay-url: ${AP_PAY_URL:https://allpay.to/app/?show=getpayment&mode=api8}

management:
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
    health:
      enabled: true

  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics
